name: Update Data & Rebuild Matrices

on:
  schedule:
    - cron: "17 21 * * *"   # 台灣時間每天早上 05:17
  workflow_dispatch:         # 允許手動觸發

permissions:
  contents: write

concurrency:
  group: update-and-build
  cancel-in-progress: true

jobs:
  update-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repo
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install yfinance pandas pyarrow numpy

      # Step 1: 下載最新價格
      - name: Update price data
        run: python update.py

      # Step 1b: 下載 CMD-TS 32 市場感測器資料（x2_sensor/）
      # 與 Step 1 同一套every-daily-run全量重抓+完整覆寫慣例，見
      # docs/acquisition_contract.md。失敗即讓這個 job 失敗（exit 1），
      # 不靜默保留舊檔——update_cmdts_x2.py 自己已經在缺任何一檔時
      # non-zero exit。
      - name: Update CMD-TS X2 sensor data
        run: python update_cmdts_x2.py

      # Step 2: 立刻重建 calendar / matrices
      - name: Rebuild matrices (US + TW)
        run: python build_matrix.py

      # Step 3: 把所有變更一次 commit push
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto update [skip ci]"
            git push
          fi
